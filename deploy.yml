# 兩件事：(1) 每週從 TDX 抓一次路網靜態資料存進 data/（或手動觸發）；(2) 把整個 repo 部署到 GitHub Pages。
# 需要：repo Settings → Pages → Source 選「GitHub Actions」；Settings → Secrets and variables → Actions 新增 TDX_CLIENT_ID、TDX_CLIENT_SECRET。
name: 更新資料並部署

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 0'      # 每週一 04:00（台灣時間）

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 從 TDX 抓路網資料
        run: node scripts/fetch-static.js
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          # 其他縣市的公車路網（只有路線與站牌，沒有免費即時車輛）。想加就用逗號隔開，例如 Taichung,Taoyuan,Kaohsiung；留空則不抓
          BUS_TDX_CITIES: Taichung
      - name: 提交 data/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "data: 更新 TDX 路網資料 $(date -u +%F)" && git push)

  deploy:
    needs: data
    if: always() && needs.data.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
