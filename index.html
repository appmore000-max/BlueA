<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>台灣捷運即時位置圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --ink:#1c2430;
    --muted:#6b7684;
    --rule:#dfe3e8;
    --panel:rgba(255,255,255,.94);
    --panel-solid:#ffffff;
    --live:#1f9d55;
    --warn:#c9822b;
    --shadow:0 6px 24px rgba(28,36,48,.14), 0 1px 3px rgba(28,36,48,.10);
    --radius:14px;
    --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--font);color:var(--ink);background:#eef1f4;overflow:hidden;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  #map{position:fixed;inset:0;background:#eef1f4}
  button{font:inherit;color:inherit}
  h1,h2,h3,p,ul{margin:0}
  ul{padding:0;list-style:none}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- top bar ---------- */
  .topbar{position:fixed;top:12px;left:12px;right:12px;z-index:1000;display:flex;align-items:center;gap:12px;pointer-events:none}
  .topbar>*{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:10px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:8px 16px 8px 12px;box-shadow:var(--shadow)}
  .brand h1{font-size:15px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
  .live-dot{width:10px;height:10px;border-radius:50%;background:#b8c0ca;flex:none;position:relative}
  .live-dot.on{background:var(--live)}
  .live-dot.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--live);opacity:.6;animation:ping 1.8s ease-out infinite}
  .live-dot.err{background:var(--warn)}
  @keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}
  .status{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
  .status b{color:var(--ink);font-weight:500}
  .spacer{flex:1}
  .btn{border:0;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);cursor:pointer;font-weight:500;white-space:nowrap}
  .btn:hover{background:#fff}
  .btn:focus-visible,.chip:focus-visible,.sys-row button:focus-visible{outline:2px solid #2b6cb0;outline-offset:2px}
  .mobile-only{display:none}

  /* ---------- panels ---------- */
  .panel{position:fixed;z-index:1000;background:var(--panel-solid);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;border-bottom:1px solid var(--rule)}
  .panel-head h2{font-size:14px;font-weight:700}
  .close{border:0;background:transparent;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1;color:var(--muted)}
  .close:hover{background:#f0f2f5;color:var(--ink)}
  .panel-body{overflow:auto;padding:10px 14px 14px;flex:1;overscroll-behavior:contain}

  .systems{left:12px;top:64px;width:300px;max-height:calc(100vh - 88px)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12px;padding:10px 14px;border-bottom:1px solid var(--rule)}
  .legend li{display:flex;align-items:center;gap:6px}
  .sw{width:14px;height:14px;border-radius:4px;background:#888;border:2px solid #fff;box-shadow:0 0 0 1px #c9cfd6;display:inline-block}
  .sw.at{box-shadow:0 0 0 1px #c9cfd6,0 0 0 4px rgba(136,136,136,.25)}
  .sw.est{border-style:dashed}

  .sys-row{padding:8px 0;border-bottom:1px solid var(--rule)}
  .sys-row:last-child{border-bottom:0}
  .sys-top{display:flex;align-items:center;gap:8px}
  .sys-top input{width:16px;height:16px;margin:0;accent-color:var(--ink);cursor:pointer}
  .sys-name{flex:1;border:0;background:transparent;text-align:left;padding:2px 4px;border-radius:6px;cursor:pointer;font-weight:500}
  .sys-name:hover{background:#f0f2f5}
  .sys-name small{color:var(--muted);font-weight:400;margin-left:6px}
  .sys-meta{font-size:12px;color:var(--muted);padding-left:24px}
  .sys-meta.err{color:var(--warn)}
  .lines{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 2px 24px}
  .chip{border:0;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;cursor:pointer;background:#f0f2f5;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
  .chip i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
  .chip.off{color:var(--muted);text-decoration:line-through}
  .chip.off i{opacity:.3}
  .chip .cnt{color:var(--muted);font-size:11px}
  .alert-line{font-size:12px;color:var(--warn);padding:4px 0 0 24px}
  .note{font-size:12px;color:var(--muted);padding:12px 14px;border-top:1px solid var(--rule)}

  .detail{right:12px;top:64px;width:340px;max-height:calc(100vh - 88px)}
  .detail[hidden]{display:none}
  .line-tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;color:#fff;background:var(--c);font-size:12px;font-weight:500}
  .d-title{font-size:20px;font-weight:700;line-height:1.3;margin-top:8px}
  .d-sub{color:var(--muted);font-size:13px}
  .d-state{margin-top:12px;padding:12px 14px;border-radius:12px;background:#f5f7f9;border-left:4px solid var(--c)}
  .d-state b{font-size:15px;font-weight:700}
  .d-state .eta{font-size:26px;font-weight:700;line-height:1.1;margin-top:2px}
  .d-state .eta small{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
  .d-section{margin-top:14px}
  .d-section h3{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}
  .stops{border-top:1px solid var(--rule)}
  .stops li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);gap:10px}
  .stops li .n{display:flex;align-items:center;gap:8px;min-width:0}
  .stops li .n i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
  .stops li .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stops li .t{font-weight:500;flex:none}
  .stops li .t.now{color:var(--live)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;color:var(--muted)}
  .kv dd{margin:0;color:var(--ink)}
  .kv dt{white-space:nowrap}
  .linkish{border:0;background:transparent;color:#2b6cb0;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
  .empty{color:var(--muted);font-size:13px;padding:8px 0}

  /* ---------- markers ---------- */
  .train-icon{width:24px;height:24px}
  .train-icon .body{position:absolute;inset:4px;border-radius:5px;background:var(--c);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transform:rotate(var(--rot,0deg));transition:transform .6s ease;cursor:pointer}
  .train-icon .body::before{content:"";position:absolute;left:50%;top:-8px;margin-left:-4px;border:4px solid transparent;border-bottom:5px solid #fff;filter:drop-shadow(0 -1px 1px rgba(0,0,0,.25))}
  .train-icon.at .body{box-shadow:0 1px 4px rgba(0,0,0,.35),0 0 0 6px color-mix(in srgb,var(--c) 28%,transparent)}
  .train-icon.wait .body{opacity:.55}
  .train-icon.est .body{border-style:dashed}
  .train-icon.sel .body{outline:3px solid var(--ink);outline-offset:1px}
  .leaflet-marker-icon.train-icon.glide{transition:transform 1.2s linear}
  .leaflet-zoom-anim .leaflet-marker-icon.train-icon.glide{transition:transform .25s cubic-bezier(0,0,.25,1)}
  .st-label{background:rgba(255,255,255,.85);border:0;box-shadow:none;color:var(--ink);font-family:var(--font);font-size:11px;padding:1px 5px;border-radius:4px;font-weight:500}
  .st-label::before{display:none}
  .leaflet-container{font-family:var(--font)}
  .leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.7)}
  .leaflet-bottom.leaflet-right .leaflet-control-zoom{margin-bottom:calc(14px + var(--safe-b))}

  .toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);z-index:1200;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);max-width:90vw}
  .toast[hidden]{display:none}

  /* ---------- mobile ---------- */
  @media (max-width:760px){
    .topbar{top:10px;left:10px;right:10px;gap:8px}
    .brand h1{font-size:14px}
    .status{display:none}
    .mobile-only{display:inline-block}
    .panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:58vh;border-radius:18px 18px 0 0;padding-bottom:var(--safe-b)}
    .systems{display:none}
    .systems.open{display:flex}
    .detail{z-index:1001}
    .leaflet-bottom.leaflet-right .leaflet-control-zoom{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .live-dot.on::after{animation:none}
    .leaflet-marker-icon.train-icon.glide,.train-icon .body{transition:none}
  }
</style>
</head>
<body>
<div id="map" aria-label="地圖"></div>

<header class="topbar">
  <div class="brand"><span class="live-dot" id="liveDot"></span><h1>台灣捷運即時位置圖</h1></div>
  <div class="status" id="statusText">載入路網資料…</div>
  <div class="spacer"></div>
  <button class="btn mobile-only" id="btnSystems" type="button">系統</button>
  <button class="btn" id="btnRefresh" type="button">立即更新</button>
</header>

<aside class="panel systems" id="systemsPanel" aria-label="系統與路線">
  <div class="panel-head"><h2>系統與路線</h2><button class="close mobile-only" id="closeSystems" type="button" aria-label="關閉">×</button></div>
  <ul class="legend">
    <li><i class="sw at"></i>停靠／進站中</li>
    <li><i class="sw"></i>行駛中（實際進站資料推算）</li>
    <li><i class="sw est"></i>時刻表／班距推估</li>
  </ul>
  <div class="panel-body" id="systemsList"></div>
  <p class="note" id="footNote">臺北捷運：以官方公開的「列車進站站名」資料（每 30 秒）加站間行駛時間推算；其他系統沒有免費即時資料，依時刻表或班距推估。路網資料來自交通部 TDX。</p>
</aside>

<aside class="panel detail" id="detailPanel" hidden aria-live="polite">
  <div class="panel-head"><h2 id="detailHead">詳細資料</h2><button class="close" id="closeDetail" type="button" aria-label="關閉">×</button></div>
  <div class="panel-body" id="detailBody"></div>
</aside>

<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===================== CORE START (純邏輯，無 DOM / Leaflet 相依) ===================== */
const CORE = (() => {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;

  function haversine(a, b) {                       // a,b = [lat,lon] → 公尺
    const R = 6371000, dLat = toRad(b[0] - a[0]), dLon = toRad(b[1] - a[1]);
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(Math.min(1, s)));
  }
  function bearing(a, b) {                          // 由 a 指向 b 的方位角 0~360
    const y = Math.sin(toRad(b[1] - a[1])) * Math.cos(toRad(b[0]));
    const x = Math.cos(toRad(a[0])) * Math.sin(toRad(b[0])) - Math.sin(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.cos(toRad(b[1] - a[1]));
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }
  function zh(n) { if (!n) return ''; if (typeof n === 'string') return n; return n.Zh_tw || n.En || ''; }
  function num(v) { const n = Number(v); return Number.isFinite(n) ? n : null; }
  function normColor(c, fallback) {
    if (!c || typeof c !== 'string') return fallback;
    c = c.trim(); if (!c) return fallback;
    if (/^[0-9a-f]{6}$/i.test(c)) return '#' + c;
    if (/^#[0-9a-f]{3,8}$/i.test(c)) return c;
    return c;
  }
  // 回傳物件裡的第一個陣列（TDX 部分 API 以 {UpdateTime,..., Xxx:[...]} 包裝）
  function pickArray(d) {
    if (Array.isArray(d)) return d;
    if (d && typeof d === 'object') for (const k of Object.keys(d)) if (Array.isArray(d[k])) return d[k];
    return [];
  }

  /* ---------- 幾何：WKT / polyline / 投影 ---------- */
  function parseWKT(wkt) {                           // 回傳 [[ [lat,lon], ... ], ...]
    if (!wkt || typeof wkt !== 'string') return [];
    const parts = [];
    const re = /\(([^()]+)\)/g; let m;
    while ((m = re.exec(wkt))) {
      const pts = m[1].split(',').map(s => s.trim().split(/\s+/).map(Number)).filter(p => p.length >= 2 && Number.isFinite(p[0]) && Number.isFinite(p[1])).map(p => [p[1], p[0]]);
      if (pts.length >= 2) parts.push(pts);
    }
    return parts;
  }
  function decodePolyline(str) {                     // Google encoded polyline → [[lat,lon],...]
    const out = []; let idx = 0, lat = 0, lng = 0;
    while (idx < str.length) {
      let b, shift = 0, res = 0;
      do { b = str.charCodeAt(idx++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lat += (res & 1) ? ~(res >> 1) : (res >> 1); shift = 0; res = 0;
      do { b = str.charCodeAt(idx++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lng += (res & 1) ? ~(res >> 1) : (res >> 1);
      out.push([lat / 1e5, lng / 1e5]);
    }
    return out;
  }
  // 把首尾相接的線段接成一條（TDX 的 MULTILINESTRING 常是切段而非支線）
  function stitchParts(parts, tol = 30) {
    let remaining = parts.filter(p => p && p.length >= 2).map(p => p.slice());
    const out = [];
    while (remaining.length) {
      let cur = remaining.shift(), changed = true;
      while (changed) {
        changed = false;
        for (let i = 0; i < remaining.length; i++) {
          const p = remaining[i], cs = cur[0], ce = cur[cur.length - 1], ps = p[0], pe = p[p.length - 1];
          if (haversine(ce, ps) < tol) cur = cur.concat(p.slice(1));
          else if (haversine(ce, pe) < tol) cur = cur.concat(p.slice().reverse().slice(1));
          else if (haversine(cs, pe) < tol) cur = p.concat(cur.slice(1));
          else if (haversine(cs, ps) < tol) cur = p.slice().reverse().concat(cur.slice(1));
          else continue;
          remaining.splice(i, 1); changed = true; break;
        }
      }
      out.push(cur);
    }
    return out;
  }
  function prepPart(part) {                          // 加上累積里程 part.cum
    const cum = [0];
    for (let i = 1; i < part.length; i++) cum.push(cum[i - 1] + haversine(part[i - 1], part[i]));
    part.cum = cum; return part;
  }
  function projectOnPart(part, pt) {                 // 點投影到折線 → {dist, chain, idx}
    const cosLat = Math.cos(toRad(pt[0]));
    const X = p => [(p[1] - pt[1]) * 111320 * cosLat, (p[0] - pt[0]) * 110540];
    let best = { dist: Infinity, chain: 0, idx: 0 };
    for (let i = 0; i < part.length - 1; i++) {
      const a = X(part[i]), b = X(part[i + 1]);
      const dx = b[0] - a[0], dy = b[1] - a[1], len2 = dx * dx + dy * dy;
      let t = len2 ? (-a[0] * dx - a[1] * dy) / len2 : 0; t = Math.max(0, Math.min(1, t));
      const d = Math.hypot(a[0] + t * dx, a[1] + t * dy);
      if (d < best.dist) best = { dist: d, chain: part.cum[i] + t * (part.cum[i + 1] - part.cum[i]), idx: i };
    }
    return best;
  }
  function pointAtChain(part, chain) {               // 里程 → {latlng, bearing}
    const cum = part.cum, total = cum[cum.length - 1];
    chain = Math.max(0, Math.min(total, chain));
    let i = 0; while (i < cum.length - 2 && cum[i + 1] < chain) i++;
    const a = part[i], b = part[i + 1], seg = cum[i + 1] - cum[i];
    const t = seg > 0 ? (chain - cum[i]) / seg : 0;
    return { latlng: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], bearing: bearing(a, b) };
  }
  function projectStations(line, stations) {         // line.proj[stationId] = {partIdx, chain, dist}
    line.proj = {};
    for (const id of line.stationSet) {
      const st = stations.get(id); if (!st) continue;
      let best = null;
      line.parts.forEach((part, partIdx) => {
        const r = projectOnPart(part, st.latlng);
        if (!best || r.dist < best.dist) best = { partIdx, chain: r.chain, dist: r.dist };
      });
      if (best) line.proj[id] = best;
    }
  }
  // P→S 之間比例 f (0=剛離開 P, 1=到達 S) 的位置
  function positionBetween(line, stations, P, S, f) {
    const a = stations.get(P), b = stations.get(S);
    if (!a || !b) return null;
    const pp = line.proj[P], ps = line.proj[S];
    if (pp && ps && pp.partIdx === ps.partIdx && pp.dist < 400 && ps.dist < 400 && Math.abs(ps.chain - pp.chain) > 5) {
      const part = line.parts[pp.partIdx];
      const r = pointAtChain(part, pp.chain + (ps.chain - pp.chain) * f);
      return { latlng: r.latlng, bearing: ps.chain >= pp.chain ? r.bearing : (r.bearing + 180) % 360 };
    }
    return { latlng: [a.latlng[0] + (b.latlng[0] - a.latlng[0]) * f, a.latlng[1] + (b.latlng[1] - a.latlng[1]) * f], bearing: bearing(a.latlng, b.latlng) };
  }

  /* ---------- 路線圖（站間相鄰關係） ---------- */
  function buildLineGraph(line) {
    line.hopCache = null;
    const adj = new Map();
    const add = (a, b) => { if (!adj.has(a)) adj.set(a, new Set()); adj.get(a).add(b); };
    for (const path of line.routes) for (let i = 0; i < path.length - 1; i++) { add(path[i], path[i + 1]); add(path[i + 1], path[i]); }
    line.adj = adj; line._hop = new Map();
  }
  // 以「目的地」為根做 BFS：next(S)=S 往目的地的下一站, dist(S)=距目的地站數
  function hopMaps(line, dest) {
    if (!line.hopCache) line.hopCache = new Map();
    if (line.hopCache.has(dest)) return line.hopCache.get(dest);
    const r = hopMapsRaw(line, dest); line.hopCache.set(dest, r); return r;
  }
  function hopMapsRaw(line, dest) {
    if (line._hop.has(dest)) return line._hop.get(dest);
    const next = new Map(), dist = new Map();
    if (line.adj && line.adj.has(dest)) {
      next.set(dest, null); dist.set(dest, 0); const q = [dest];
      while (q.length) { const u = q.shift(); for (const v of line.adj.get(u) || []) if (!next.has(v)) { next.set(v, u); dist.set(v, dist.get(u) + 1); q.push(v); } }
    }
    const preds = new Map();
    for (const [s, n] of next) if (n) { if (!preds.has(n)) preds.set(n, []); preds.get(n).push(s); }
    const r = { next, dist, preds }; line._hop.set(dest, r); return r;
  }
  function runTime(line, stations, A, B) {           // 站間行駛秒數
    const s = line.s2s && (line.s2s[A + '>' + B] || line.s2s[B + '>' + A]);
    if (s && s.run > 0) return s.run;
    const a = stations.get(A), b = stations.get(B);
    if (a && b) return Math.max(45, haversine(a.latlng, b.latlng) / (line.speed || 10));
    return 90;
  }

  /* ---------- 由時刻表建立 ETA 查表 ---------- */
  // 回傳 Map(stationId → Map(destId → {eta(分), destName, headSign, rec, nextTimes}))
  const DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  function serviceDayMatches(sd, dow) {
    if (!sd || typeof sd !== 'object') return true;
    const k = DOW[dow]; if (!(k in sd)) return true;
    return !!sd[k];
  }
  function etaLookupFromTimetable(records, now) {
    const dow = now.getDay(), mins = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    const lookup = new Map();

  /* ---------- 核心：由各站 ETA 推算列車位置 ---------- */

  }

  /* ---------- 臺北捷運公開「列車進站站名」資料（免金鑰、每 30 秒）→ 追蹤全部列車 ---------- */

  /* ---------- 沒有時刻表的系統：用「首末班車＋班距」合成一份今天的站別時刻表 ---------- */
  const hhmm = m => String(Math.floor((m % 1440) / 60)).padStart(2, '0') + ':' + String(Math.floor(m % 60)).padStart(2, '0');

function buildSystem(S, lines, stations, routes, sol, shapes, s2s) {

  }

    line.stations.forEach(id => line.stationSet.add(id));

function deriveS2SFromTimetable(S) {

  for (const r of S.timetable) {
    const dest = r.DestinationStationID || r.DestinationStaionID; if (!dest || !r.StationID) continue;
    const tag = r.ServiceDay && (r.ServiceDay.ServiceTag || Object.keys(r.ServiceDay).filter(k => r.ServiceDay[k] === true).join('')) || '';
    for (const t of (r.Timetables || [])) {

    }

    const diffs = [];

    const A = state.systems[ids[i]], B = state.systems[ids[j]]; if (!A || !B || A.status !== 'ok' || B.status !== 'ok') continue;
    for (const bl of B.lines.values()) {
      const al = A.lines.get(bl.id); if (!al || bl.hidden || al.hidden || al.stationSet.size < 2 || bl.stationSet.size < 2) continue;
      let inter = 0; for (const id of bl.stationSet) if (al.stationSet.has(id)) inter++;
      if (inter >= 0.5 * Math.min(al.stationSet.size, bl.stationSet.size)) {

    if (S.mode === 'platform') tasks.push(fetchLive(S.cfg)
      .then(recs => { S.live.feed = recs; S.live.feedTime = Date.now(); S.live.feedErr = null; S.live.srcTime = maxTime(recs); })
      .catch(e => { S.live.feedErr = e.message; }));
    else if (S.ttSource === 'sim' && S.simDay !== new Date().toDateString()) rebuildSim(S);   // 過了午夜重新合成今天的班表
  }
  await Promise.allSettled(tasks);
  state.liveOk = Object.values(state.systems).some(S => S.status === 'ok' && ((S.mode === 'platform' && S.live.feedTime && !S.live.feedErr) || S.timetable));
  computeAllTrains(); renderTrains(); renderSystems();

    const recs = SS.timetable.filter(r => line.stationSet.has(r.StationID) && (!r.LineID || r.LineID === line.id));
    if (recs.length) { const { lookup } = etaLookupFromTimetable(recs, new Date()); return inferTrainsForLine(line, SS.stations, lookup, SS.ttSource === 'sim' ? 'sim' : 'timetable', null); }
  }

function computeAllTrains() {

    let mine = [];
    if (S.mode === 'platform') {
      if (S.live.feedTime) mine = platformUpdate(S.tracker, S, S.nameIdx, S.live.feed, S.live.srcTime, now).filter(t => { const l = lineByKey(t.lineKey); return l && !l.hidden; });

  if (t.status === 'moving') return positionBetween(line, S.stations, t.from, t.to, t.f);
  const st = S.stations.get(t.at); if (!st) return null;
  const nb = t.facing && S.stations.get(t.facing), pb = t.backOf && S.stations.get(t.backOf);
  return { latlng: st.latlng, bearing: nb ? bearing(st.latlng, nb.latlng) : pb ? bearing(pb.latlng, st.latlng) : 0 };
}
// 依「離站時間」推進位置：兩次更新之間用等速前進補間，並被 ETA 上下限夾住
function updateKinematics(now) {
  for (const t of state.trains) {
    if (t.status !== 'moving') continue;
    if (t.source === 'timetable' || t.source === 'sim') {    // 時刻表：ETA 隨時間線性遞減
      const eta = Math.max(0, t.eta - (now - t.computedAt) / 60000);
      t.f = Math.max(0.04, Math.min(0.97, 1 - (eta * 60) / t.rt)); continue;
    }
    if (!t.departedAt) continue;
    const fdr = ((now - t.departedAt) / 1000) / t.rt;         // 等速推進
    t.f = Math.max(t.fMin, Math.min(t.fMax, fdr));
  }
}
function carryOverKinematics(now) {
  const prev = new Map(); for (const o of state.prevTrains) if (o.uid) prev.set(o.uid, o);
  for (const t of state.trains) {
    t.computedAt = now;
    if (t.status !== 'moving' || t.source !== 'live' || t.departedAt) continue;
    const o = t.uid && prev.get(t.uid); if (!o) continue;
    if (o.status === 'moving' && o.from === t.from && o.to === t.to && o.departedAt) t.departedAt = o.departedAt;
    else if (o.status === 'at' && o.at === t.from) t.departedAt = now - REFRESH_MS / 2;   // 上次還停在前站，估計中途離站
    else if (o.status === 'moving' && o.to === t.from) t.departedAt = now - REFRESH_MS / 2; // 上次還在前一段，這段剛開始
    if (t.departedAt) {                                       // 起算點需與 ETA 區間一致，否則放棄推算
      const fdr = ((now - t.departedAt) / 1000) / t.rt;
      if (fdr < t.fMin - 0.35 || fdr > t.fMax + 0.35) t.departedAt = null;
    }
  }
}
function moveMarker(m, t, pos, line, flags) {
  const el = m.getElement();
  if (el) {
    if (flags) for (const k in flags) el.classList.toggle(k, flags[k]);
    const b = el.firstElementChild; if (b) { b.style.setProperty('--rot', pos.bearing.toFixed(0) + 'deg'); b.style.setProperty('--c', line.color); }
    el.classList.add('glide'); clearTimeout(m._glideT); m._glideT = setTimeout(() => el.classList.remove('glide'), 1300);
  }
  m.setLatLng(pos.latlng);
}
function tickMotion() {
  if (!state.trains.length) return;
  updateKinematics(Date.now());
  for (const t of state.trains) {
    if (t.status !== 'moving' || !t.uid) continue;
    const m = state.markers.get(t.uid), line = lineByKey(t.lineKey); if (!m || !line) continue;
    const pos = trainPosition(t); if (!pos) continue;
    t.latlng = pos.latlng; moveMarker(m, t, pos, line, null);
  }
}
setInterval(tickMotion, 1000);
function renderTrains() {
  const now = Date.now();
  matchTrains(state.prevTrains, state.trains);
  for (const t of state.trains) if (!t.uid) t.uid = state.uidSeq++;
  carryOverKinematics(now); updateKinematics(now);
  const alive = new Set();
  for (const t of state.trains) {
    const line = lineByKey(t.lineKey), S = state.systems[t.sys]; if (!line || !S || line.visible === false) continue;
    const pos = trainPosition(t); if (!pos) continue;
    alive.add(t.uid); t.latlng = pos.latlng; t.bearingDeg = pos.bearing;
    const sel = state.selected && state.selected.type === 'train' && state.selected.uid === t.uid;
    const flags = { at: t.status === 'at', wait: t.status === 'wait', est: t.source === 'timetable' || t.source === 'sim', sel };
    let m = state.markers.get(t.uid);
    if (!m) {
      const cls = 'train-icon ' + Object.keys(flags).filter(k => flags[k]).join(' ');
      m = L.marker(pos.latlng, { pane: 'trains', keyboard: false, icon: L.divIcon({ className: cls, iconSize: [24, 24], iconAnchor: [12, 12], html: `<div class="body" style="--c:${line.color};--rot:${pos.bearing.toFixed(0)}deg" title="${esc(line.name)} 往${esc(t.destName || '')}"></div>` }) });
      m.on('click', () => selectTrain(m.train.uid));
      m.addTo(S.layers.trains); state.markers.set(t.uid, m);
    } else moveMarker(m, t, pos, line, flags);
    m.train = t;
  }
  for (const [uid, m] of state.markers) if (!alive.has(uid)) { m.remove(); state.markers.delete(uid); }
  state.prevTrains = state.trains;
  if (state.selected && state.selected.type === 'train') showTrainDetail(state.selected.uid);
}

/* ---------- 側欄：系統清單 ---------- */
function liveMeta(S) {
  const L2 = S.live;
  if (S.mode === 'none') return '沒有此系統的時刻表或即時資料，僅顯示路線與車站';
  if (S.mode === 'timetable') return '沒有免費即時資料，依站別時刻表推估';
  if (S.mode === 'sim') return `沒有時刻表，依首末班車＋班距模擬${S.simNote}`;
  if (L2.feedErr) return `即時資料讀取失敗：${L2.feedErr}`;
  if (!L2.feedTime) return '等待即時資料…';
  const age = L2.srcTime ? Math.round((Date.now() - L2.srcTime) / 1000) : null;
  const stale = age != null && age > 150 ? `（來源已 ${Math.round(age / 60)} 分未更新）` : '';
  const un = S.tracker.unresolved ? ` · ${S.tracker.unresolved} 筆站名對不上` : '';
  return `官方「列車進站」公開資料 · 月台 ${S.tracker.seenAt.size} 列、推算中 ${S.tracker.moving.size} 列 · 資料 ${fmtTime(L2.srcTime || L2.feedTime)}${stale}${un}`;
}
function renderSystems() {
  const html = [];
  for (const cfg of ACTIVE_SYSTEMS) {
    const S = state.systems[cfg.id]; if (!S) continue;
    let meta = S.status === 'loading' ? '載入路網中…' : S.status === 'error' ? `路網載入失敗：${esc(S.err || '')}` : esc(liveMeta(S));
    const chips = [...S.lines.values()].filter(l => !l.hidden).map(l =>
      `<button type="button" class="chip ${l.visible === false ? 'off' : ''}" data-line="${esc(l.key)}" style="--c:${esc(l.color)}" aria-pressed="${l.visible !== false}"><i></i>${esc(l.name)}<span class="cnt num">${countTrains(l.key) || ''}</span></button>`).join('');
    html.push(`<div class="sys-row">
      <div class="sys-top"><input type="checkbox" ${S.visible ? 'checked' : ''} data-toggle="${cfg.id}" aria-label="顯示${esc(cfg.name)}">
        <button class="sys-name" type="button" data-zoom="${cfg.id}">${esc(cfg.name)}<small class="num">${S.status === 'ok' ? S.trains.length + ' 列' : ''}</small></button></div>
      <div class="sys-meta ${S.status === 'error' || S.live.feedErr ? 'err' : ''}">${meta}</div>
      <div class="lines">${chips}</div></div>`);
  }
  $('systemsList').innerHTML = html.join('');
}
$('systemsList').addEventListener('click', e => {
  const tg = e.target.closest('[data-toggle]'); if (tg) { const S = state.systems[tg.dataset.toggle]; S.visible = tg.checked; for (const g of Object.values(S.layers)) S.visible ? g.addTo(map) : map.removeLayer(g); return; }
  const zb = e.target.closest('[data-zoom]'); if (zb) { zoomSystem(zb.dataset.zoom); return; }
  const ch = e.target.closest('[data-line]'); if (ch) {
    const line = lineByKey(ch.dataset.line); if (!line) return;
    line.visible = line.visible === false; const S = state.systems[line.sys];
    for (const pl of (line.polylines || [])) line.visible ? pl.addTo(S.layers.lines) : S.layers.lines.removeLayer(pl);
    updateStationVisibility(S); renderTrains(); renderSystems();
  }
});

/* ---------- 詳細資料面板 ---------- */
function openDetail(head, body) { $('detailHead').textContent = head; $('detailBody').innerHTML = body; $('detailPanel').hidden = false; }
function closeDetail() {
  $('detailPanel').hidden = true;
  if (state.selected && state.selected.type === 'train') { const m = state.markers.get(state.selected.uid); const el = m && m.getElement(); if (el) el.classList.remove('sel'); }
  state.selected = null;
}
function selectTrain(uid) {
  if (state.selected && state.selected.type === 'train') { const m = state.markers.get(state.selected.uid); const el = m && m.getElement(); if (el) el.classList.remove('sel'); }
  state.selected = { type: 'train', uid };
  const m = state.markers.get(uid); const el = m && m.getElement(); if (el) el.classList.add('sel');
  showTrainDetail(uid);
}
function showTrainDetail(uid) {
  const t = state.trains.find(x => x.uid === uid);
  if (!t) { openDetail('列車', '<p class="empty">這列車已抵達終點，或在最新一次更新後無法再對應到同一列車。</p>'); return; }
  const line = lineByKey(t.lineKey), S = state.systems[t.sys];
  const nm = id => (S.stations.get(id) || {}).name || id || '—';
  const c = esc(line.color);
  let stateHtml = '';
  if (t.status === 'at') stateHtml = `<b>停靠／進站中</b><div class="eta">${esc(nm(t.at))}</div>${t.facing ? `<div class="d-sub">下一站 ${esc(nm(t.facing))}</div>` : ''}`;
  else if (t.status === 'wait') stateHtml = `<b>起點站待發車</b><div class="eta">${esc(nm(t.at))}<small>約 ${fmtEta(t.eta)} 後發車</small></div>`;
  else stateHtml = `<b>行駛中</b><div class="eta">${esc(nm(t.from))} → ${esc(nm(t.to))}</div><div class="d-sub">抵達 ${esc(nm(t.to))}：${fmtEta(t.eta)}</div>`;
  const stops = (t.upcoming || []).map(u => `<li><span class="n"><i style="--c:${c}"></i><span>${esc(nm(u.station))}</span></span><span class="t num ${u.eta <= 0.05 ? 'now' : ''}">${fmtEta(u.eta)}</span></li>`).join('');
  const srcLabel = t.source === 'platform' ? '臺北捷運公開資料「列車進站站名」（每 30 秒）＋站間行駛時間推算' : t.source === 'sim' ? '首末班車＋班距模擬（此系統沒有時刻表）' : '站別時刻表推估（此系統沒有免費即時資料）';
  const body = `
    <span class="line-tag" style="--c:${c}">${esc(S.cfg.name)} · ${esc(line.name)}</span>
    <div class="d-title">往 ${esc(t.destName || nm(t.dest) || (t.direction != null ? '方向 ' + t.direction : ''))}</div>
    ${t.headSign && t.headSign !== t.destName ? `<div class="d-sub">${esc(t.headSign)}</div>` : ''}
    <div class="d-state" style="--c:${c}">${stateHtml}</div>
    ${stops ? `<div class="d-section"><h3>接下來停靠</h3><ul class="stops">${stops}</ul></div>` : ''}
    <div class="d-section"><dl class="kv">
      <dt>資料來源</dt><dd>${srcLabel}</dd>
      <dt>來源更新</dt><dd class="num">${fmtTime(t.srcTime || state.lastLiveAt)}</dd>
      <dt>路線代碼</dt><dd>${esc(line.id)}${t.dest ? ' · 終點 ' + esc(t.dest) : ''}</dd>
    </dl></div>
    ${t.ambiguous ? '<p class="d-sub" style="margin-top:12px">這個月台同時屬於兩條路線，資料無法分辨是哪一條，暫依第一條顯示。</p>' : ''}
    ${t.hops ? `<p class="d-sub" style="margin-top:12px">這列車已連續 ${t.hops} 站沒被進站資料看到，位置為純推算。</p>` : ''}
    <p class="d-sub" style="margin-top:12px">${t.source === 'platform' ? '離開月台後的位置由站間行駛時間推算，實際可能略有前後。' : '依班表推估，未考慮誤點與臨時調度。'}</p>`;
  openDetail(line.name, body);
}
function selectStation(sysId, id) {
  closeDetail(); state.selected = { type: 'station', sys: sysId, id };
  const S = state.systems[sysId], st = S.stations.get(id); if (!st) return;
  const lines = [...st.lines].map(lineByKey).filter(l => l && !l.hidden);
  const tags = lines.map(l => `<span class="line-tag" style="--c:${esc(l.color)}">${esc(l.name)}</span>`).join(' ');
  const rows = [], nm = x => (S.stations.get(x) || {}).name || x;
  const colorOf = t => esc((lineByKey(t.lineKey) || {}).color || '#888');
  // 進站資料：正在月台的列車，以及推算中即將抵達的列車
  const here = state.trains.filter(t => t.sys === sysId && ((t.status === 'at' && t.at === id) || (t.status === 'moving' && t.to === id))).sort((a, b) => a.eta - b.eta);
  for (const t of here) rows.push(`<li><span class="n"><i style="--c:${colorOf(t)}"></i><span>往 ${esc(t.destName || nm(t.dest))}</span></span><span class="t num ${t.status === 'at' ? 'now' : ''}">${t.status === 'at' ? '進站中' : '約 ' + fmtEta(t.eta)}</span></li>`);
  // 時刻表：下幾班
  if (!rows.length) {
    const srcSys = new Set([sysId]); lines.forEach(l => l.alsoIn.forEach(x => srcSys.add(x)));
    for (const sid of srcSys) {
      const SS = state.systems[sid]; if (!SS || !SS.timetable) continue;
      const { lookup } = etaLookupFromTimetable(SS.timetable.filter(r => r.StationID === id), new Date());
      const m = lookup.get(id); if (!m) continue;
      for (const [dest, info] of m) rows.push(`<li><span class="n"><i style="--c:${esc((lineByKey(sid + ':' + (info.rec.LineID || '')) || lines[0] || {}).color || '#888')}"></i><span>往 ${esc(info.destName)}（${SS.ttSource === 'sim' ? '班距模擬' : '時刻表'}）</span></span><span class="t num">${info.nextTimes.map(x => fmtEta(x)).join('、')}</span></li>`);
    }
  }
  const body = `${tags}<div class="d-title">${esc(st.name)}</div><div class="d-sub">${esc(S.cfg.name)} · ${esc(id)}${st.raw && st.raw.StationAddress ? '<br>' + esc(st.raw.StationAddress) : ''}</div>
    <div class="d-section"><h3>${S.mode === 'platform' ? '月台與即將抵達' : '下一班列車'}</h3>${rows.length ? `<ul class="stops">${rows.join('')}</ul>` : `<p class="empty">${S.mode === 'platform' ? '目前沒有列車在這一站的月台，也沒有推算中即將抵達的列車。' : '目前沒有這一站的班次資料。'}</p>`}</div>
    <div class="d-section"><button type="button" class="linkish" id="btnCenter">在地圖上置中</button></div>`;
  openDetail('車站', body);
  $('btnCenter').onclick = () => map.flyTo(st.latlng, Math.max(map.getZoom(), 15), { duration: .6 });
}

/* ---------- 狀態列與更新循環 ---------- */
function setStatus() {
  const dot = $('liveDot'), el = $('statusText');
  const anyErr = Object.values(state.systems).some(S => S.status === 'ok' && S.live.feedErr);
  dot.classList.toggle('on', state.liveOk && !anyErr); dot.classList.toggle('err', !!anyErr);
  if (state.refreshing) { el.innerHTML = '更新中…'; return; }
  if (!state.lastLiveAt) { el.innerHTML = '載入路網資料…'; return; }
  const left = Math.max(0, Math.ceil((state.nextRefreshAt - Date.now()) / 1000));
  el.innerHTML = `${MOCK ? '<b>示範資料</b> · ' : ''}<b class="num">${state.trains.length}</b> 列 · 更新於 <span class="num">${fmtTime(state.lastLiveAt)}</span> · <span class="num">${left}</span> 秒後更新`;
}
setInterval(() => {
  setStatus();
  if (state.lastLiveAt && !document.hidden && Date.now() >= state.nextRefreshAt) refreshLive();
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.lastLiveAt && Date.now() >= state.nextRefreshAt) refreshLive(); });

$('btnRefresh').addEventListener('click', () => { if (state.lastLiveAt) refreshLive(); });
$('btnSystems').addEventListener('click', () => $('systemsPanel').classList.toggle('open'));
$('closeSystems').addEventListener('click', () => $('systemsPanel').classList.remove('open'));
$('closeDetail').addEventListener('click', closeDetail);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
map.on('click', () => { if (state.selected) closeDetail(); });

/* ---------- 啟動 ---------- */
(async function init() {
  if (MOCK) $('footNote').textContent = '目前為示範資料模式（?mock=1）：路網與列車皆為模擬，不代表真實營運。';
  else fetch(`${DATA_BASE}/index.json`).then(r => r.ok ? r.json() : null).then(d => { if (d && d.generatedAt) { state.dataInfo = d; $('footNote').textContent += ` 路網資料產生於 ${new Date(d.generatedAt).toLocaleDateString('zh-TW')}。`; } }).catch(() => {});
  await Promise.all(ACTIVE_SYSTEMS.map(loadSystem));
  dedupeSharedLines();
  for (const S of Object.values(state.systems)) if (S.status === 'ok') drawSystem(S);
  const okCount = Object.values(state.systems).filter(S => S.status === 'ok').length;
  if (!okCount) { toast('路網資料載入失敗：請先在 GitHub 執行 Actions「更新資料並部署」產生 data/ 資料夾（見 README）', 12000); $('statusText').textContent = '路網載入失敗'; return; }
  const want = Q.get('sys');
  if (want && state.systems[want] && state.systems[want].status === 'ok') zoomSystem(want); else fitAll();
  applyLabels();
  await refreshLive();
})();
</script>
</body>
</html>
