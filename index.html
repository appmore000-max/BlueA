<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="metaTheme">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="捷運即時">
<title>台灣捷運即時位置圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --ink:#1c2430;
    --muted:#6b7684;
    --rule:#dfe3e8;
    --panel:rgba(255,255,255,.94);
    --panel-solid:#ffffff;
    --live:#1f9d55;
    --warn:#c9822b;
    --shadow:0 6px 24px rgba(28,36,48,.14), 0 1px 3px rgba(28,36,48,.10);
    --radius:14px;
    --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  body.dark{--ink:#e6ebf1;--muted:#98a3b1;--rule:#2b3542;--panel:rgba(24,29,36,.92);--panel-solid:#181d24;--shadow:0 6px 24px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.35);background:#0e1115;color-scheme:dark}
  body.dark .chip{background:#252c36}
  body.dark .chip:hover{background:#2f3742}
  body.dark .d-state{background:#1f252d}
  body.dark .linkish{color:#7fb4ec}
  body.dark .sys-name:hover{background:#252c36}
  body.dark select,body.dark input[type=text],body.dark input[type=search]{background:#11161c;color:var(--ink);border-color:#2b3542}
  body.dark #map{background:#0e1115}
  body.dark .leaflet-tile-pane .basemap{filter:invert(1) hue-rotate(180deg) grayscale(1) brightness(.72) contrast(.95);opacity:.95}
  body.dark .btn:hover{background:#232a33}
  body.dark .btn.on{background:#e6ebf1;color:#0e1115;border-color:#e6ebf1}
  body.dark .st-label{background:rgba(24,29,36,.88)}
  body.dark .train-tip,body.dark .exit-label{background:#181d24}
  body.dark .toast{background:#e6ebf1;color:#0e1115}
  body.dark .sw{border-color:#181d24;box-shadow:0 0 0 1px #3a4553}
  body.dark .leaflet-bar a{background:#181d24;color:#e6ebf1;border-bottom-color:#2b3542}
  body.dark .leaflet-bar a:hover{background:#232a33}
  body.dark .leaflet-control-attribution{background:rgba(24,29,36,.85);color:#98a3b1}
  body.dark .leaflet-control-attribution a{color:#cbd3dc}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--font);color:var(--ink);background:#eef1f4;overflow:hidden;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  #map{position:fixed;inset:0;background:#eef1f4}
  button{font:inherit;color:inherit}
  h1,h2,h3,p,ul{margin:0}
  ul{padding:0;list-style:none}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- top bar ---------- */
  .topbar{position:fixed;top:12px;left:12px;right:12px;z-index:1000;display:flex;align-items:center;gap:12px;pointer-events:none}
  .topbar>*{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:10px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:8px 16px 8px 12px;box-shadow:var(--shadow)}
  .brand h1{font-size:15px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
  .live-dot{width:10px;height:10px;border-radius:50%;background:#b8c0ca;flex:none;position:relative}
  .live-dot.on{background:var(--live)}
  .live-dot.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--live);opacity:.6;animation:ping 1.8s ease-out infinite}
  .live-dot.err{background:var(--warn)}
  @keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}
  .status{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
  .status b{color:var(--ink);font-weight:500}
  .spacer{flex:1}
  .btn{border:0;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);cursor:pointer;font-weight:500;white-space:nowrap}
  .btn:hover{background:#fff}
  .btn:focus-visible,.chip:focus-visible,.sys-row button:focus-visible{outline:2px solid #2b6cb0;outline-offset:2px}
  .mobile-only{display:none}

  /* ---------- panels ---------- */
  .panel{position:fixed;z-index:1000;background:var(--panel-solid);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;border-bottom:1px solid var(--rule)}
  .panel-head h2{font-size:14px;font-weight:700}
  .close{border:0;background:transparent;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1;color:var(--muted)}
  .close:hover{background:#f0f2f5;color:var(--ink)}
  .panel-body{overflow:auto;padding:10px 14px 14px;flex:1;overscroll-behavior:contain}

  .systems{left:12px;top:64px;width:300px;max-height:calc(100vh - 88px)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12px;padding:10px 14px;border-bottom:1px solid var(--rule)}
  .legend li{display:flex;align-items:center;gap:6px}
  .sw{width:14px;height:14px;border-radius:4px;background:#888;border:2px solid #fff;box-shadow:0 0 0 1px #c9cfd6;display:inline-block}
  .sw.at{box-shadow:0 0 0 1px #c9cfd6,0 0 0 4px rgba(136,136,136,.25)}
  .sw.est{border-style:dashed}

  .sys-row{padding:8px 0;border-bottom:1px solid var(--rule)}
  .grp{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:12px 0 2px}
  .bus-search-row{display:flex;gap:6px;margin:6px 0}
  .bus-search-row select,.bus-search-row input{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink);min-width:0}
  .bus-search-row select{flex:0 0 auto;max-width:44%}
  .bus-search-row input{flex:1}
  .bus-results{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto}
  .bus-results button{border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px}
  .bus-results button:hover{background:#f0f2f5}
  .bus-results button small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.dark .bus-results button:hover{background:#252c36}
  .sw.bus{border-radius:50%;background:#e67e22}
  .bus-tip{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:3px 7px;font:600 12px/1.3 var(--font);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .bus-tip::before{display:none}
  body.dark .bus-tip{background:#181d24}
  .sys-row:last-child{border-bottom:0}
  .sys-top{display:flex;align-items:center;gap:8px}
  .sys-top input{width:16px;height:16px;margin:0;accent-color:var(--ink);cursor:pointer}
  .sys-name{flex:1;border:0;background:transparent;text-align:left;padding:2px 4px;border-radius:6px;cursor:pointer;font-weight:500}
  .sys-name:hover{background:#f0f2f5}
  .sys-name small{color:var(--muted);font-weight:400;margin-left:6px}
  .sys-meta{font-size:12px;color:var(--muted);padding-left:24px}
  .sys-meta.err{color:var(--warn)}
  .lines{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 2px 24px}
  .chip{border:0;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;cursor:pointer;background:#f0f2f5;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
  .chip i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
  .chip.off{color:var(--muted);text-decoration:line-through}
  .chip.off i{opacity:.3}
  .chip .cnt{color:var(--muted);font-size:11px}
  .alert-line{font-size:12px;color:var(--warn);padding:4px 0 0 24px}
  .note{font-size:12px;color:var(--muted);padding:12px 14px;border-top:1px solid var(--rule)}

  .detail{right:12px;top:64px;width:340px;max-height:calc(100vh - 88px)}
  .detail[hidden]{display:none}
  .line-tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;color:#fff;background:var(--c);font-size:12px;font-weight:500}
  .d-title{font-size:20px;font-weight:700;line-height:1.3;margin-top:8px}
  .d-sub{color:var(--muted);font-size:13px}
  .d-state{margin-top:12px;padding:12px 14px;border-radius:12px;background:#f5f7f9;border-left:4px solid var(--c)}
  .d-state b{font-size:15px;font-weight:700}
  .d-state .eta{font-size:26px;font-weight:700;line-height:1.1;margin-top:2px}
  .d-state .eta small{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
  .d-section{margin-top:14px}
  .d-section h3{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}
  .stops{border-top:1px solid var(--rule)}
  .stops li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);gap:10px}
  .stops li .n{display:flex;align-items:center;gap:8px;min-width:0}
  .stops li .n i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
  .stops li .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stops li .t{font-weight:500;flex:none}
  .stops li .t.now{color:var(--live)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;color:var(--muted)}
  .kv dd{margin:0;color:var(--ink)}
  .kv dt{white-space:nowrap}
  .linkish{border:0;background:transparent;color:#2b6cb0;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
  .empty{color:var(--muted);font-size:13px;padding:8px 0}

  /* ---------- markers ---------- */
  .train-icon{width:24px;height:24px}
  .train-icon .body{position:absolute;inset:4px;border-radius:5px;background:var(--c);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transform:rotate(var(--rot,0deg)) translateX(6px);transition:transform .6s ease;cursor:pointer}
  .train-icon .body::before{content:"";position:absolute;left:50%;top:-8px;margin-left:-4px;border:4px solid transparent;border-bottom:5px solid #fff;filter:drop-shadow(0 -1px 1px rgba(0,0,0,.25))}
  .train-icon.at .body{box-shadow:0 1px 4px rgba(0,0,0,.35),0 0 0 6px color-mix(in srgb,var(--c) 28%,transparent)}
  .train-icon.wait .body{opacity:.55}
  .train-icon.est .body{border-style:dashed}
  .train-icon.sel .body{outline:3px solid var(--ink);outline-offset:1px}
  .leaflet-marker-icon.train-icon.glide{transition:transform 1.2s linear}
  .leaflet-zoom-anim .leaflet-marker-icon.train-icon.glide{transition:transform .25s cubic-bezier(0,0,.25,1)}
  .st-label{background:rgba(255,255,255,.85);border:0;box-shadow:none;color:var(--ink);font-family:var(--font);font-size:11px;padding:1px 5px;border-radius:4px;font-weight:500}
  .st-label::before{display:none}
  .leaflet-container{font-family:var(--font)}
  .leaflet-tile-pane .basemap{filter:grayscale(1) brightness(1.07) contrast(.9);opacity:.8}
  .train-tip{background:#fff;border:1px solid var(--rule);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.12);padding:6px 9px;font:12px/1.4 var(--font);color:var(--ink);white-space:nowrap}
  .train-tip::before{display:none}
  .exit-label{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:1px 5px;font:600 11px/1.3 var(--font);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .exit-label::before{display:none}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn-row .btn{padding:6px 12px;font-size:13px}
  .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.7)}
  .leaflet-bottom.leaflet-right .leaflet-control-zoom{margin-bottom:calc(14px + var(--safe-b))}

  .toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);z-index:1200;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);max-width:90vw}
  .toast[hidden]{display:none}

  /* ---------- mobile ---------- */
  @media (max-width:760px){
    .topbar{top:10px;left:10px;right:10px;gap:8px}
    .brand h1{font-size:14px}
    .status{display:none}
    .mobile-only{display:inline-block}
    .panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:58vh;border-radius:18px 18px 0 0;padding-bottom:var(--safe-b)}
    .systems{display:none}
    .systems.open{display:flex}
    .detail{z-index:1001}
    .leaflet-bottom.leaflet-right .leaflet-control-zoom{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .live-dot.on::after{animation:none}
    .leaflet-marker-icon.train-icon.glide,.train-icon .body{transition:none}
  }
</style>
</head>
<body>
<div id="map" aria-label="地圖"></div>

<header class="topbar">
  <div class="brand"><span class="live-dot" id="liveDot"></span><h1>台灣捷運即時位置圖</h1></div>
  <div class="status" id="statusText">載入路網資料…</div>
  <div class="spacer"></div>
  <button class="btn mobile-only" id="btnSystems" type="button">系統</button>
  <button class="btn" id="btnTheme" type="button" title="切換深色／淺色">深色</button>
  <button class="btn" id="btnLocate" type="button" title="定位到我附近">定位</button>
  <button class="btn" id="btnRefresh" type="button">立即更新</button>
</header>

<aside class="panel systems" id="systemsPanel" aria-label="系統與路線">
  <div class="panel-head"><h2>系統與路線</h2><button class="close mobile-only" id="closeSystems" type="button" aria-label="關閉">×</button></div>
  <ul class="legend">
    <li><i class="sw at"></i>停靠／進站中</li>
    <li><i class="sw"></i>行駛中（實際進站資料推算）</li>
    <li><i class="sw est"></i>時刻表／班距推估</li>
    <li><i class="sw bus"></i>公車（GPS）</li>
  </ul>
  <div class="panel-body"><div id="systemsList"></div>
    <div class="bus-search" id="busSearch" hidden>
      <div class="grp">公車路線查詢</div>
      <div class="bus-search-row"><select id="busCity" aria-label="縣市"></select><input id="busQuery" type="search" placeholder="路線號碼，例如 300" autocomplete="off" aria-label="路線號碼"></div>
      <div id="busResults" class="bus-results"></div>
    </div>
  </div>
  <p class="note" id="footNote">臺北捷運：以官方公開的「列車進站站名」資料（每 30 秒）加站間行駛時間推算；其他系統沒有免費即時資料，依時刻表或班距推估。路網資料來自交通部 TDX。</p>
</aside>

<aside class="panel detail" id="detailPanel" hidden aria-live="polite">
  <div class="panel-head"><h2 id="detailHead">詳細資料</h2><button class="close" id="closeDetail" type="button" aria-label="關閉">×</button></div>
  <div class="panel-body" id="detailBody"></div>
</aside>

<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===================== CORE START (純邏輯，無 DOM / Leaflet 相依) ===================== */
const CORE = (() => {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;

  function haversine(a, b) {                       // a,b = [lat,lon] → 公尺
    const R = 6371000, dLat = toRad(b[0] - a[0]), dLon = toRad(b[1] - a[1]);
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(Math.min(1, s)));
  }
  function bearing(a, b) {                          // 由 a 指向 b 的方位角 0~360
    const y = Math.sin(toRad(b[1] - a[1])) * Math.cos(toRad(b[0]));
    const x = Math.cos(toRad(a[0])) * Math.sin(toRad(b[0])) - Math.sin(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.cos(toRad(b[1] - a[1]));
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }
  function zh(n) { if (!n) return ''; if (typeof n === 'string') return n; return n.Zh_tw || n.En || ''; }
  function num(v) { const n = Number(v); return Number.isFinite(n) ? n : null; }
  function normColor(c, fallback) {
    if (!c || typeof c !== 'string') return fallback;
    c = c.trim(); if (!c) return fallback;
    if (/^[0-9a-f]{6}$/i.test(c)) return '#' + c;
    if (/^#[0-9a-f]{3,8}$/i.test(c)) return c;
    return c;
  }
  // 回傳物件裡的第一個陣列（TDX 部分 API 以 {UpdateTime,..., Xxx:[...]} 包裝）
  function pickArray(d) {
    if (Array.isArray(d)) return d;
    if (d && typeof d === 'object') for (const k of Object.keys(d)) if (Array.isArray(d[k])) return d[k];
    return [];
  }

  /* ---------- 幾何：WKT / polyline / 投影 ---------- */
  function parseWKT(wkt) {                           // 回傳 [[ [lat,lon], ... ], ...]
    if (!wkt || typeof wkt !== 'string') return [];
    const parts = [];
    const re = /\(([^()]+)\)/g; let m;
    while ((m = re.exec(wkt))) {
      const pts = m[1].split(',').map(s => s.trim().split(/\s+/).map(Number)).filter(p => p.length >= 2 && Number.isFinite(p[0]) && Number.isFinite(p[1])).map(p => [p[1], p[0]]);
      if (pts.length >= 2) parts.push(pts);
    }
    return parts;
  }
  function decodePolyline(str) {                     // Google encoded polyline → [[lat,lon],...]
    const out = []; let idx = 0, lat = 0, lng = 0;
    while (idx < str.length) {
      let b, shift = 0, res = 0;
      do { b = str.charCodeAt(idx++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lat += (res & 1) ? ~(res >> 1) : (res >> 1); shift = 0; res = 0;
      do { b = str.charCodeAt(idx++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lng += (res & 1) ? ~(res >> 1) : (res >> 1);
      out.push([lat / 1e5, lng / 1e5]);
    }
    return out;
  }
  // 把首尾相接的線段接成一條（TDX 的 MULTILINESTRING 常是切段而非支線）
  function stitchParts(parts, tol = 30) {
    let remaining = parts.filter(p => p && p.length >= 2).map(p => p.slice());
    const out = [];
    while (remaining.length) {
      let cur = remaining.shift(), changed = true;
      while (changed) {
        changed = false;
        for (let i = 0; i < remaining.length; i++) {
          const p = remaining[i], cs = cur[0], ce = cur[cur.length - 1], ps = p[0], pe = p[p.length - 1];
          if (haversine(ce, ps) < tol) cur = cur.concat(p.slice(1));
          else if (haversine(ce, pe) < tol) cur = cur.concat(p.slice().reverse().slice(1));
          else if (haversine(cs, pe) < tol) cur = p.concat(cur.slice(1));
          else if (haversine(cs, ps) < tol) cur = p.slice().reverse().concat(cur.slice(1));
          else continue;
          remaining.splice(i, 1); changed = true; break;
        }
      }
      out.push(cur);
    }
    return out;
  }
  function prepPart(part) {                          // 加上累積里程 part.cum
    const cum = [0];
    for (let i = 1; i < part.length; i++) cum.push(cum[i - 1] + haversine(part[i - 1], part[i]));
    part.cum = cum; return part;
  }
  function projectOnPart(part, pt) {                 // 點投影到折線 → {dist, chain, idx}
    const cosLat = Math.cos(toRad(pt[0]));
    const X = p => [(p[1] - pt[1]) * 111320 * cosLat, (p[0] - pt[0]) * 110540];
    let best = { dist: Infinity, chain: 0, idx: 0 };
    for (let i = 0; i < part.length - 1; i++) {
      const a = X(part[i]), b = X(part[i + 1]);
      const dx = b[0] - a[0], dy = b[1] - a[1], len2 = dx * dx + dy * dy;

// 靜態資料：data/<系統>/<種類>.json（404 → null）
async function loadStatic(sys, kind) {
  if (mock) return mock.static(sys, kind);
  const res = await fetch(`${DATA_BASE}/${sys}/${kind}.json`);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`HTTP ${res.status} ${kind}`);
  return res.json();
}
// 即時資料：直接抓公開來源，或經免費代理（?src=）
async function bufToText(buf) {
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0x1f && u8[1] === 0x8b && typeof DecompressionStream === 'function') {
    const ds = new DecompressionStream('gzip'); const w = ds.writable.getWriter(); w.write(u8); w.close();
    return new Response(ds.readable).text();
  }
  return new TextDecoder('utf-8').decode(u8);
}
async function fetchLive(cfg) {
  if (mock) return mock.live(cfg.id);
  const url = LIVE_PROXY ? `${LIVE_PROXY}${LIVE_PROXY.includes('?') ? '&' : '?'}src=${encodeURIComponent(cfg.src)}` : cfg.feed;
  let res;
  try { res = await fetch(url, { cache: 'no-store' }); }
  catch (e) { throw new Error(LIVE_PROXY ? `連不到代理 ${LIVE_PROXY}` : '瀏覽器直接讀取公開資料被擋（CORS）。請照 README 建立免費的 Cloudflare Worker 代理，填入 CONFIG.liveProxy'); }
  if (!res.ok) { const t = await res.text().catch(() => ''); throw new Error(`HTTP ${res.status}${t ? ' ' + t.slice(0, 80) : ''}`); }
  const text = (await bufToText(await res.arrayBuffer())).replace(/^\uFEFF/, '');
  return pickArray(JSON.parse(text));
}

/* ---------- 載入路網 ---------- */
async function loadSystem(cfg) {
  const S = state.systems[cfg.id] = {
    cfg, lines: new Map(), stations: new Map(), status: 'loading', err: null, timetable: null, ttSource: null, simNote: '', simDay: null, mode: 'none', trains: [], visible: true,
    live: { feed: [], feedTime: null, srcTime: null, feedErr: null }, tracker: createPlatformTracker(), nameIdx: null,
    layers: { lines: L.layerGroup().addTo(map), stations: L.layerGroup().addTo(map), trains: L.layerGroup().addTo(map) }
  };
  renderSystems();
  try {
    const get = k => loadStatic(cfg.id, k).catch(() => null);
    if (cfg.kind === 'train') { await loadRailSystem(S, get); S.status = 'ok'; renderSystems(); return; }
    const [lines, stations, routes, sol, shapes, s2s] = await Promise.all(['Line', 'Station', 'StationOfRoute', 'StationOfLine', 'Shape', 'S2STravelTime'].map(get));
    if (!lines || !stations) throw new Error(`找不到 data/${cfg.id}/Line.json 或 Station.json：repo 裡還沒有 data/ 資料夾。到 GitHub 的 Actions 頁籤，選「更新資料並部署」按 Run workflow 跑一次（需先在 Settings → Secrets 填 TDX_CLIENT_ID / TDX_CLIENT_SECRET）`);
    buildSystem(S, lines, stations, routes, sol || [], shapes || [], s2s || []);
    if (!S.lines.size) throw new Error('沒有路線資料');
    if (cfg.live === 'platform') { S.mode = 'platform'; S.nameIdx = buildNameIndex(S); }
    else await loadTimetable(S, get);
    S.status = 'ok';
  } catch (e) { S.status = 'error'; S.err = e.message; }
  renderSystems();
}
// 台鐵／高鐵：路網 + 定期時刻表（Trains.json）。高鐵沒有 Line／StationOfLine 就用車站代碼順序合成一條線
async function loadRailSystem(S, get) {
  const cfg = S.cfg;
  const [stations, linesRaw, solRaw, shapes, trains] = await Promise.all(['Station', 'Line', 'StationOfLine', 'Shape', 'Trains'].map(get));
  if (!stations) throw new Error(`找不到 data/${cfg.id}/Station.json：請重新執行 Actions「更新資料並部署」（新版會抓台鐵、高鐵）`);
  let lines = linesRaw ? pickArray(linesRaw) : [], sol = solRaw ? pickArray(solRaw) : [];
  if (!lines.length) {
    const ids = pickArray(stations).map(x => x.StationID).filter(Boolean).sort();
    lines = [{ LineID: cfg.id, LineName: { Zh_tw: cfg.name }, LineColor: cfg.color }];
    sol = [{ LineID: cfg.id, Stations: ids.map((id, i) => ({ Sequence: i + 1, StationID: id })) }];
  }
  lines = lines.map((ln, i) => ({ ...ln, LineColor: ln.LineColor || RAIL_PALETTE[i % RAIL_PALETTE.length] }));
  buildSystem(S, lines, stations, [], sol, shapes || [], []);
  for (const line of S.lines.values()) if (!line.stationSet.size) line.hidden = true;   // 沒有車站序的線不畫
  if (![...S.lines.values()].some(l => !l.hidden)) throw new Error('沒有路線資料');
  S.trainData = trains && trains.trains ? trains : null;
  S.mode = S.trainData ? 'train' : 'none';
}
// 沒有即時資料的系統：站別時刻表 → 沒有的話用「首末班車＋班距」合成 → 都沒有就只畫路線
async function loadTimetable(S, get) {
  const tt = await get('StationTimeTable'); const arr = tt ? pickArray(tt) : [];
  if (arr.length) { S.timetable = arr; S.ttSource = 'timetable'; S.mode = 'timetable'; deriveS2SFromTimetable(S); return; }
  const [fl, fq] = await Promise.all([get('FirstLastTimetable'), get('Frequency')]);
  S.firstLast = fl ? pickArray(fl) : []; S.frequency = fq ? pickArray(fq) : [];
  rebuildSim(S);
}
function rebuildSim(S) {
  const now = new Date();
  const freq = S.simHeadway ? [{ ServiceDay: null, Headways: [{ StartTime: '00:00', EndTime: '24:00', MinHeadwayMins: S.simHeadway, MaxHeadwayMins: S.simHeadway }] }] : (S.frequency || []);
  const { records, usedDefault } = synthTimetable(S, S.firstLast || [], freq, now);
  S.simDay = now.toDateString();
  if (records.length) { S.timetable = records; S.ttSource = 'sim'; S.mode = 'sim'; S.simNote = S.simHeadway ? `（官網目前班距 ${S.simHeadway} 分）` : usedDefault ? '（無班距資料，以 8 分估）' : ''; }
  else { S.timetable = null; S.ttSource = null; S.mode = 'none'; }
}

function buildSystem(S, lines, stations, routes, sol, shapes, s2s) {
  const sys = S.cfg.id;
  for (const st of pickArray(stations)) {
    const p = st.StationPosition || {}; const lat = num(p.PositionLat), lon = num(p.PositionLon);
    if (lat == null || lon == null || !lat || !st.StationID) continue;
    S.stations.set(st.StationID, { id: st.StationID, name: zh(st.StationName) || st.StationID, latlng: [lat, lon], lines: new Set(), raw: st });
  }
  for (const ln of pickArray(lines)) {
    const id = ln.LineID || ln.LineNo; if (!id) continue;
    S.lines.set(id, { key: sys + ':' + id, sys, id, name: zh(ln.LineName) || id, color: normColor(ln.LineColor, S.cfg.color), routes: [], stations: [], stationSet: new Set(), parts: [], proj: {}, s2s: {}, speed: S.cfg.speed || 10, hidden: false, visible: true, alsoIn: [] });
  }
  const guessLine = rid => { if (!rid) return null; const s = String(rid); for (const id of S.lines.keys()) if (s === id || s.startsWith(id + '-') || s.startsWith(id + '_')) return id; return null; };
  const seqIds = arr => (arr || []).slice().sort((a, b) => (num(a.Sequence) || 0) - (num(b.Sequence) || 0)).map(x => x.StationID).filter(id => S.stations.has(id));
  for (const r of pickArray(routes)) {
    const line = S.lines.get(r.LineID) || S.lines.get(guessLine(r.RouteID)); if (!line) continue;
    const ids = seqIds(r.Stations); if (ids.length >= 2) line.routes.push(ids);
  }
  for (const r of pickArray(sol)) {
    const line = S.lines.get(r.LineID) || S.lines.get(r.LineNo); if (!line) continue;
    const ids = seqIds(r.Stations); if (!ids.length) continue;
    line.stations = ids; if (!line.routes.length && ids.length >= 2) line.routes.push(ids);
  }
  for (const line of S.lines.values()) {
    for (const p of line.routes) p.forEach(id => line.stationSet.add(id));
    line.stations.forEach(id => line.stationSet.add(id));
    if (!line.stations.length) line.stations = [...line.stationSet];
    for (const id of line.stationSet) S.stations.get(id).lines.add(line.key);
    buildLineGraph(line);
  }
  for (const sh of pickArray(shapes)) {
    const line = S.lines.get(sh.LineID) || S.lines.get(sh.LineNo) || S.lines.get(guessLine(sh.RouteID)); if (!line) continue;
    let parts = parseWKT(sh.Geometry);
    if (!parts.length && sh.EncodedPolyline) { try { parts = [decodePolyline(sh.EncodedPolyline)]; } catch (e) { parts = []; } }
    line.parts.push(...parts);
  }
  for (const rec of pickArray(s2s)) {
    const line = S.lines.get(rec.LineID) || S.lines.get(guessLine(rec.RouteID)); if (!line) continue;
    for (const t of (rec.TravelTimes || [])) {
      const run = num(t.RunTime); if (!t.FromStationID || !t.ToStationID || run == null) continue;
      line.s2s[t.FromStationID + '>' + t.ToStationID] = { run, stop: num(t.StopTime) || 0 };
    }
  }
  for (const line of S.lines.values()) { line.parts = stitchParts(line.parts).map(prepPart); projectStations(line, S.stations); }
}

// 時刻表若附 TrainNo，可用同一車次在相鄰兩站的時刻差，推得站間行駛秒數（中位數）
function deriveS2SFromTimetable(S) {
  const toMin = t => { const [h, m] = String(t || '').split(':').map(Number); return Number.isFinite(h) && Number.isFinite(m) ? h * 60 + m : null; };
  const byTrain = new Map();   // dest|TrainNo|ServiceTag → Map(stationId → min)
  for (const r of S.timetable) {
    const dest = r.DestinationStationID || r.DestinationStaionID; if (!dest || !r.StationID) continue;
    const tag = r.ServiceDay && (r.ServiceDay.ServiceTag || Object.keys(r.ServiceDay).filter(k => r.ServiceDay[k] === true).join('')) || '';
    for (const t of (r.Timetables || [])) {
      if (t.TrainNo == null) continue; const m = toMin(t.ArrivalTime || t.DepartureTime); if (m == null) continue;
      const k = dest + '|' + t.TrainNo + '|' + tag; if (!byTrain.has(k)) byTrain.set(k, new Map()); byTrain.get(k).set(r.StationID, m);
    }
  }
  if (!byTrain.size) return;
  for (const line of S.lines.values()) for (const path of line.routes) for (let i = 0; i < path.length - 1; i++) {
    const A = path[i], B = path[i + 1]; if (line.s2s[A + '>' + B]) continue;
    const diffs = [];
    for (const m of byTrain.values()) { if (m.has(A) && m.has(B)) { const d = m.get(B) - m.get(A); if (d > 0 && d < 30) diffs.push(d); } }
    if (diffs.length >= 3) { diffs.sort((a, b) => a - b); line.s2s[A + '>' + B] = { run: diffs[Math.floor(diffs.length / 2)] * 60, stop: 0, fromTimetable: true }; }
  }
}
// 同一條線同時出現在兩個系統（例如環狀線在臺北／新北捷運資料都有）時只畫一次
function dedupeSharedLines() {
  const ids = ACTIVE_SYSTEMS.map(c => c.id);
  for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
    const A = state.systems[ids[i]], B = state.systems[ids[j]]; if (!A || !B || A.status !== 'ok' || B.status !== 'ok') continue;
    if (!A.cfg.family || A.cfg.family !== B.cfg.family) continue;   // 不同體系的路線代碼會撞名（北捷 R02… vs 高捷 R10…），不能比
    for (const bl of B.lines.values()) {
      const al = A.lines.get(bl.id); if (!al || bl.hidden || al.hidden || al.stationSet.size < 2 || bl.stationSet.size < 2) continue;
      let inter = 0, sameName = 0;
      for (const id of bl.stationSet) if (al.stationSet.has(id)) { inter++; if ((A.stations.get(id) || {}).name === (B.stations.get(id) || {}).name) sameName++; }
      if (inter >= 0.5 * Math.min(al.stationSet.size, bl.stationSet.size) && sameName >= 0.5 * inter) {
        bl.hidden = true; bl.mergedInto = al.key; al.alsoIn.push(B.cfg.id);
        if (!al.parts.length && bl.parts.length) al.parts = bl.parts;
        if (!al.routes.length && bl.routes.length) { al.routes = bl.routes; buildLineGraph(al); }
        projectStations(al, A.stations);
      }
    }
  }
}

/* ---------- 畫路線與車站 ---------- */
function routesToParts(line, stations) {
  return line.routes.map(p => p.map(id => stations.get(id).latlng)).filter(p => p.length >= 2);
}
function drawSystem(S) {
  for (const line of S.lines.values()) {
    if (line.hidden) continue;
    const parts = line.parts.length ? line.parts : routesToParts(line, S.stations);
    line.polylines = parts.map(p => L.polyline(p, { pane: 'lines', color: line.color, weight: 5, opacity: .9, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(S.layers.lines));
  }
  for (const st of S.stations.values()) {
    const visLines = [...st.lines].map(lineByKey).filter(l => l && !l.hidden);
    if (!visLines.length) continue;
    const isX = visLines.length > 1; st.isX = isX;
    st.marker = L.circleMarker(st.latlng, { pane: 'stations', bubblingMouseEvents: false, radius: isX ? 5 : 3.5, color: isX ? (isDark() ? '#e6ebf1' : '#1c2430') : visLines[0].color, weight: isX ? 2.5 : 2, fillColor: '#fff', fillOpacity: 1 }).addTo(S.layers.stations);
    st.marker.bindTooltip(st.name, { direction: 'top', offset: [0, -4], className: 'st-label' });
    st.marker.on('click', () => selectStation(S.cfg.id, st.id));
  }
}
function updateStationVisibility(S) {
  for (const st of S.stations.values()) {
    if (!st.marker) continue;
    const anyVisible = [...st.lines].map(lineByKey).some(l => l && !l.hidden && l.visible !== false);
    if (anyVisible) { if (!S.layers.stations.hasLayer(st.marker)) st.marker.addTo(S.layers.stations); }
    else S.layers.stations.removeLayer(st.marker);
  }
}
function applyLabels() {
  const show = map.getZoom() >= 14, b = map.getBounds();
  for (const S of Object.values(state.systems)) for (const st of S.stations.values()) {
    const m = st.marker; if (!m) continue;
    const want = show && b.contains(st.latlng);
    if (want && !st.labeled) { m.unbindTooltip(); m.bindTooltip(st.name, { permanent: true, direction: 'right', offset: [7, 0], className: 'st-label', interactive: false }); st.labeled = true; }
    else if (!want && st.labeled) { m.unbindTooltip(); m.bindTooltip(st.name, { direction: 'top', offset: [0, -4], className: 'st-label' }); st.labeled = false; }
  }
}
map.on('zoomend moveend', applyLabels);

function systemBounds(S) { const pts = [...S.stations.values()].filter(st => st.lines.size).map(st => st.latlng); return pts.length ? L.latLngBounds(pts) : null; }
function zoomSystem(id) {

  map.flyToBounds(b, { padding: isMobile() ? [30, 30] : [60, 60], maxZoom: 13, duration: .8 });
  if (isMobile()) $('systemsPanel').classList.remove('open');
}
function fitAll() {
  const pts = []; for (const S of Object.values(state.systems)) if (S.status === 'ok') for (const st of S.stations.values()) if (st.lines.size) pts.push(st.latlng);
  if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: isMobile() ? [20, 20] : [60, 60] });
}

/* ---------- 即時資料 ---------- */
async function refreshLive() {
  if (state.refreshing) return; state.refreshing = true; setStatus();
  const tasks = [];
  for (const S of Object.values(state.systems)) {
    if (S.status !== 'ok') continue;
    if (S.mode === 'platform') tasks.push(fetchLive(S.cfg)
      .then(recs => { S.live.feed = recs; S.live.feedTime = Date.now(); S.live.feedErr = null; S.live.srcTime = maxTime(recs); })
      .catch(e => { S.live.feedErr = e.message; }));
    else if (S.ttSource === 'sim' && S.simDay !== new Date().toDateString()) rebuildSim(S);   // 過了午夜重新合成今天的班表
    if (S.cfg.statusSrc && LIVE_PROXY && (!S.statusAt || Date.now() - S.statusAt > 5 * 60 * 1000)) tasks.push(fetchStatus(S));
  }
  if (state.bus.on.size && Date.now() - state.bus.lastAt >= 19000) { state.bus.lastAt = Date.now(); for (const id of state.bus.on) tasks.push(fetchBusCity(id)); }
  await Promise.allSettled(tasks);
  state.liveOk = Object.values(state.systems).some(S => S.status === 'ok' && ((S.mode === 'platform' && S.live.feedTime && !S.live.feedErr) || S.timetable || S.mode === 'train'));
  computeAllTrains(); renderTrains(); renderBuses(); renderSystems();
  state.lastLiveAt = Date.now(); state.nextRefreshAt = Date.now() + REFRESH_MS; state.refreshing = false; setStatus();
}
// 營運公司官網的營運狀態／目前班距（目前只有臺中捷運）；班距若與模擬用的不同，就用官網的重新合成班表
async function fetchStatus(S) {
  S.statusAt = Date.now();
  try {
    const res = await fetch(`${LIVE_PROXY}${LIVE_PROXY.includes('?') ? '&' : '?'}src=${encodeURIComponent(S.cfg.statusSrc)}`, { cache: 'no-store' });
    if (!res.ok) return;
    const st = await res.json(); S.opStatus = st;
    if (S.ttSource === 'sim' && st.headwayMin && st.headwayMin !== S.simHeadway) { S.simHeadway = st.headwayMin; rebuildSim(S); }
  } catch (e) { /* 官網抓不到就維持原本的模擬 */ }
}
function maxTime(recs) { let m = null; for (const r of recs) { const t = parseTime(r.UpdateTime || r.SrcUpdateTime || r.updateTime); if (t && (!m || t > m)) m = t; } return m; }

// 時刻表／班距推估（本系統，或共用路線的另一個系統）
function computeTrainsForLine(line) {
  for (const sid of [line.sys, ...line.alsoIn]) {
    const SS = state.systems[sid]; if (!SS || !SS.timetable) continue;
    const recs = SS.timetable.filter(r => line.stationSet.has(r.StationID) && (!r.LineID || r.LineID === line.id));
    if (recs.length) { const { lookup } = etaLookupFromTimetable(recs, new Date()); return inferTrainsForLine(line, SS.stations, lookup, SS.ttSource === 'sim' ? 'sim' : 'timetable', null); }
  }
  return [];
}
function computeAllTrains() {
  const out = [], now = Date.now();
  for (const S of Object.values(state.systems)) {
    if (S.status !== 'ok') { S.trains = []; continue; }
    let mine = [];
    if (S.mode === 'platform') {
      if (S.live.feedTime) mine = platformUpdate(S.tracker, S, S.nameIdx, S.live.feed, S.live.srcTime, now).filter(t => { const l = lineByKey(t.lineKey); return l && !l.hidden; });
      const covered = new Set(mine.map(t => t.lineKey));
      for (const line of S.lines.values()) if (!line.hidden && !covered.has(line.key) && line.alsoIn.length) mine.push(...computeTrainsForLine(line));
    } else if (S.mode === 'train') {
      mine = scheduledTrains(S, S.trainData, new Date()).filter(t => { const l = lineByKey(t.lineKey); return l && !l.hidden && l.visible !== false; });
    } else if (S.timetable) {

  if (S.mode === 'none') return S.cfg.kind === 'train' ? '沒有時刻表資料（data/ 裡缺 Trains.json），僅顯示路線與車站' : '沒有此系統的時刻表或即時資料，僅顯示路線與車站';
  if (S.mode === 'train') return `依定期時刻表逐車模擬（沒有免費的即時誤點資料）${S.trains.length === 0 && state.lastLiveAt ? '（目前沒有班次）' : ''}`;
  const none = S.trains.length === 0 && state.lastLiveAt ? '（目前沒有班次）' : '';
  if (S.mode === 'timetable') return `沒有免費即時資料，依站別時刻表推估${none}`;
  if (S.mode === 'sim') return `沒有時刻表，依首末班車＋班距模擬${S.simNote}${S.opStatus && S.opStatus.status ? ` · 官網：${esc(S.opStatus.status)}` : ''}${none}`;
  if (L2.feedErr) return `即時資料讀取失敗：${L2.feedErr}`;
  if (!L2.feedTime) return '等待即時資料…';
  const age = L2.srcTime ? Math.round((Date.now() - L2.srcTime) / 1000) : null;
  const stale = age != null && age > 150 ? `（來源已 ${Math.round(age / 60)} 分未更新）` : '';
  const un = S.tracker.unresolved ? ` · ${S.tracker.unresolved} 筆站名對不上` : '';
  return `官方「列車進站」公開資料 · 月台 ${S.tracker.seenAt.size} 列、推算中 ${S.tracker.moving.size} 列 · 資料 ${fmtTime(L2.srcTime || L2.feedTime)}${stale}${un}`;
}
function renderSystems() {
  const html = []; let lastGroup = null;
  const GROUP_NAME = { metro: '捷運／輕軌', rail: '臺鐵／高鐵' };
  for (const cfg of ACTIVE_SYSTEMS) {
    const S = state.systems[cfg.id]; if (!S) continue;
    const g = cfg.group || 'metro'; if (g !== lastGroup) { html.push(`<div class="grp">${GROUP_NAME[g] || g}</div>`); lastGroup = g; }
    let meta = S.status === 'loading' ? '載入路網中…' : S.status === 'error' ? `路網載入失敗：${esc(S.err || '')}` : esc(liveMeta(S));
    const chips = [...S.lines.values()].filter(l => !l.hidden).map(l =>
      `<button type="button" class="chip ${l.visible === false ? 'off' : ''}" data-line="${esc(l.key)}" style="--c:${esc(l.color)}" aria-pressed="${l.visible !== false}"><i></i>${esc(l.name)}<span class="cnt num">${countTrains(l.key) || ''}</span></button>`).join('');
    html.push(`<div class="sys-row">
      <div class="sys-top"><input type="checkbox" ${S.visible ? 'checked' : ''} data-toggle="${cfg.id}" aria-label="顯示${esc(cfg.name)}">
        <button class="sys-name" type="button" data-zoom="${cfg.id}">${esc(cfg.name)}<small class="num">${S.status === 'ok' ? S.trains.length + ' 列' : ''}</small></button></div>
      <div class="sys-meta ${S.status === 'error' || S.live.feedErr ? 'err' : ''}">${meta}</div>
      <div class="lines">${chips}</div></div>`);
  }
  html.push('<div class="grp">公車（即時 GPS）</div>');
  for (const c of ACTIVE_BUS) {
    const B = state.bus.cities[c.id];
    const on = state.bus.on.has(c.id);
    const meta = !on ? '勾選後才會抓車輛位置（每 20 秒，約 100 KB）' : B.err ? `讀取失敗：${esc(B.err)}` : !B.list ? '讀取中…' : `${B.shown} 輛在畫面內／共 ${B.list.length} 輛${B.capped ? '（太多，只畫一部分，請放大地圖）' : ''} · 資料 ${fmtTime(B.at)}`;
    html.push(`<div class="sys-row"><div class="sys-top"><input type="checkbox" ${on ? 'checked' : ''} data-bus="${c.id}" aria-label="顯示${esc(c.name)}">
      <button class="sys-name" type="button" data-buszoom="${c.id}">${esc(c.name)}</button></div>
      <div class="sys-meta ${B.err ? 'err' : ''}">${meta}</div></div>`);
  }
  $('systemsList').innerHTML = html.join('');
}
$('systemsList').addEventListener('click', e => {
  const bt = e.target.closest('[data-bus]'); if (bt) { toggleBusCity(bt.dataset.bus, bt.checked); return; }
  const bz = e.target.closest('[data-buszoom]'); if (bz) { const c = ACTIVE_BUS.find(x => x.id === bz.dataset.buszoom); if (c && c.center) map.flyTo(c.center, 12, { duration: .8 }); return; }
  const tg = e.target.closest('[data-toggle]'); if (tg) { const S = state.systems[tg.dataset.toggle]; S.visible = tg.checked; for (const g of Object.values(S.layers)) S.visible ? g.addTo(map) : map.removeLayer(g); savePref('hidden', Object.values(state.systems).filter(x => !x.visible).map(x => x.cfg.id)); return; }
  const zb = e.target.closest('[data-zoom]'); if (zb) { zoomSystem(zb.dataset.zoom); return; }
  const ch = e.target.closest('[data-line]'); if (ch) {
    const line = lineByKey(ch.dataset.line); if (!line) return;
    line.visible = line.visible === false; const S = state.systems[line.sys];
    for (const pl of (line.polylines || [])) line.visible ? pl.addTo(S.layers.lines) : S.layers.lines.removeLayer(pl);
    updateStationVisibility(S); renderTrains(); renderSystems();
  }
});

/* ---------- 詳細資料面板 ---------- */
function openDetail(head, body) { $('detailHead').textContent = head; $('detailBody').innerHTML = body; $('detailPanel').hidden = false; }
function closeDetail() {
  $('detailPanel').hidden = true; state.follow = false; exitLayer.clearLayers(); busRouteLayer.clearLayers();
  const hadRoute = !!state.bus.routeSel; state.bus.routeSel = null;
  if (state.bus.selected || hadRoute) { state.bus.selected = null; renderBuses(); }
  if (state.selected && state.selected.type === 'train') { const m = state.markers.get(state.selected.uid); const el = m && m.getElement(); if (el) el.classList.remove('sel'); }
  state.selected = null;
}
function selectTrain(uid) {
  if (state.selected && state.selected.type === 'train') { const m = state.markers.get(state.selected.uid); const el = m && m.getElement(); if (el) el.classList.remove('sel'); }
  state.selected = { type: 'train', uid };
  const m = state.markers.get(uid); const el = m && m.getElement(); if (el) el.classList.add('sel');
  showTrainDetail(uid);
}
function showTrainDetail(uid) {
  const t = state.trains.find(x => x.uid === uid);
  if (!t) { openDetail('列車', '<p class="empty">這列車已抵達終點，或在最新一次更新後無法再對應到同一列車。</p>'); return; }
  const line = lineByKey(t.lineKey), S = state.systems[t.sys];
  const nm = id => (S.stations.get(id) || {}).name || id || '—';
  const c = esc(line.color);
  let stateHtml = '';
  if (t.status === 'at') stateHtml = `<b>停靠／進站中</b><div class="eta">${esc(nm(t.at))}</div>${t.facing ? `<div class="d-sub">下一站 ${esc(nm(t.facing))}</div>` : ''}`;
  else if (t.status === 'wait') stateHtml = `<b>起點站待發車</b><div class="eta">${esc(nm(t.at))}<small>約 ${fmtEta(t.eta)} 後發車</small></div>`;
  else stateHtml = `<b>行駛中</b><div class="eta">${esc(nm(t.from))} → ${esc(nm(t.to))}</div><div class="d-sub">抵達 ${esc(nm(t.to))}：${fmtEta(t.eta)}</div>`;
  const stops = (t.upcoming || []).map(u => `<li><span class="n"><i style="--c:${c}"></i><span>${esc(nm(u.station))}</span></span><span class="t num ${u.eta <= 0.05 ? 'now' : ''}">${fmtEta(u.eta)}</span></li>`).join('');
  const srcLabel = t.source === 'platform' ? '臺北捷運公開資料「列車進站站名」（每 30 秒）＋站間行駛時間推算' : t.source === 'sim' ? '首末班車＋班距模擬（此系統沒有時刻表）' : t.source === 'train' ? 'TDX 定期時刻表逐車模擬（無即時誤點資料，臨時加班／停駛不會反映）' : '站別時刻表推估（此系統沒有免費即時資料）';
  const body = `
    <span class="line-tag" style="--c:${c}">${esc(S.cfg.name)} · ${esc(line.name)}</span>
    <div class="d-title">${t.trainNo ? `${esc(t.trainType)} ${esc(t.trainNo)} 次 · ` : ''}往 ${esc(t.destName || nm(t.dest) || (t.direction != null ? '方向 ' + t.direction : ''))}</div>
    ${t.originName ? `<div class="d-sub">${esc(t.originName)} → ${esc(t.destName)}</div>` : ''}
    ${t.headSign && t.headSign !== t.destName ? `<div class="d-sub">${esc(t.headSign)}</div>` : ''}
    <div class="d-state" style="--c:${c}">${stateHtml}</div>
    ${stops ? `<div class="d-section"><h3>接下來停靠</h3><ul class="stops">${stops}</ul></div>` : ''}
    <div class="d-section"><dl class="kv">
      <dt>資料來源</dt><dd>${srcLabel}</dd>
      <dt>來源更新</dt><dd class="num">${fmtTime(t.srcTime || state.lastLiveAt)}</dd>
      <dt>路線代碼</dt><dd>${esc(line.id)}${t.dest ? ' · 終點 ' + esc(t.dest) : ''}</dd>
    </dl></div>
    ${t.ambiguous ? '<p class="d-sub" style="margin-top:12px">這個月台同時屬於兩條路線，資料無法分辨是哪一條，暫依第一條顯示。</p>' : ''}
    ${t.hops ? `<p class="d-sub" style="margin-top:12px">這列車已連續 ${t.hops} 站沒被進站資料看到，位置為純推算。</p>` : ''}
    <p class="d-sub" style="margin-top:12px">${t.source === 'platform' ? '離開月台後的位置由站間行駛時間推算，實際可能略有前後。' : t.source === 'train' ? '依定期時刻表模擬；台鐵誤點很常見，實際位置可能落後圖上位置。' : '依班表推估，未考慮誤點與臨時調度。'}</p>
    <div class="btn-row"><button type="button" class="btn ${state.follow ? 'on' : ''}" id="btnFollow">${state.follow ? '跟隨中' : '跟隨這列車'}</button></div>`;
  openDetail(line.name, body);
  $('btnFollow').onclick = () => { state.follow = !state.follow; $('btnFollow').classList.toggle('on', state.follow); $('btnFollow').textContent = state.follow ? '跟隨中' : '跟隨這列車'; if (state.follow) { followSelected(false); if (map.getZoom() < 14) map.setZoom(15); } };
}
async function loadExits(S) {
  if (S.exits !== undefined) return S.exits;
  S.exits = null;
  try {
    const raw = await loadStatic(S.cfg.id, 'StationExit'); const byStation = new Map();
    for (const x of pickArray(raw || [])) {
      const p = x.ExitPosition || {}, lat = num(p.PositionLat), lon = num(p.PositionLon); if (!x.StationID) continue;
      if (!byStation.has(x.StationID)) byStation.set(x.StationID, []);
      byStation.get(x.StationID).push({ id: x.ExitID || '', name: zh(x.ExitName) || x.ExitID || '出口', latlng: lat != null && lon != null ? [lat, lon] : null,
        tags: [x.Elevator ? '電梯' : null, x.Escalator ? '電扶梯' : null, x.Stair ? '樓梯' : null].filter(Boolean) });
    }
    S.exits = byStation;
  } catch (e) { S.exits = null; }
  return S.exits;
}
function exitsHtml(list) {
  if (!list || !list.length) return '';
  return `<div class="d-section"><h3>出口</h3><ul class="stops">${list.map(x => `<li><span class="n"><span>${esc(x.name)}</span></span><span class="t">${esc(x.tags.join('・'))}</span></li>`).join('')}</ul></div>`;
}
function drawExits(list) {
  exitLayer.clearLayers();
  for (const x of (list || [])) if (x.latlng) L.circleMarker(x.latlng, { radius: 4, color: isDark() ? '#0e1115' : '#fff', weight: 1.5, fillColor: isDark() ? '#e6ebf1' : '#1c2430', fillOpacity: 1, pane: 'markerPane' })
    .bindTooltip(String(x.name).replace(/^出口/, ''), { permanent: true, direction: 'right', offset: [4, 0], className: 'exit-label' }).addTo(exitLayer);
}
function selectStation(sysId, id) {
  closeDetail(); state.selected = { type: 'station', sys: sysId, id };
  const S = state.systems[sysId], st = S.stations.get(id); if (!st) return;
  if (S.exits === undefined) loadExits(S).then(() => { if (state.selected && state.selected.type === 'station' && state.selected.id === id) selectStation(sysId, id); });
  const exits = S.exits ? (S.exits.get(id) || []) : [];
  const lines = [...st.lines].map(lineByKey).filter(l => l && !l.hidden);
  const tags = lines.map(l => `<span class="line-tag" style="--c:${esc(l.color)}">${esc(l.name)}</span>`).join(' ');
  const rows = [], nm = x => (S.stations.get(x) || {}).name || x;
  const colorOf = t => esc((lineByKey(t.lineKey) || {}).color || '#888');
  // 進站資料：正在月台的列車，以及推算中即將抵達的列車
  const here = state.trains.filter(t => t.sys === sysId && ((t.status === 'at' && t.at === id) || (t.status === 'moving' && t.to === id))).sort((a, b) => a.eta - b.eta);
  for (const t of here) rows.push(`<li><span class="n"><i style="--c:${colorOf(t)}"></i><span>往 ${esc(t.destName || nm(t.dest))}</span></span><span class="t num ${t.status === 'at' ? 'now' : ''}">${t.status === 'at' ? '進站中' : '約 ' + fmtEta(t.eta)}</span></li>`);
  // 台鐵／高鐵：接下來兩小時的發車
  if (S.mode === 'train') {
    rows.length = 0;
    for (const d of stationDepartures(S, S.trainData, id, new Date(), 120).slice(0, 10)) rows.push(`<li><span class="n"><i style="--c:${esc(S.cfg.color)}"></i><span>${esc(d.time)} ${esc(d.type)} ${esc(d.no)} 次 往${esc(d.destName)}</span></span><span class="t num ${d.eta <= 1 ? 'now' : ''}">${fmtEta(d.eta)}</span></li>`);
  }
  // 時刻表：下幾班
  if (!rows.length && S.mode !== 'train') {
    const srcSys = new Set([sysId]); lines.forEach(l => l.alsoIn.forEach(x => srcSys.add(x)));
    for (const sid of srcSys) {
      const SS = state.systems[sid]; if (!SS || !SS.timetable) continue;
      const { lookup } = etaLookupFromTimetable(SS.timetable.filter(r => r.StationID === id), new Date());
      const m = lookup.get(id); if (!m) continue;
      for (const [dest, info] of m) rows.push(`<li><span class="n"><i style="--c:${esc((lineByKey(sid + ':' + (info.rec.LineID || '')) || lines[0] || {}).color || '#888')}"></i><span>往 ${esc(info.destName)}（${SS.ttSource === 'sim' ? '班距模擬' : '時刻表'}）</span></span><span class="t num">${info.nextTimes.map(x => fmtEta(x)).join('、')}</span></li>`);
    }
  }
  const body = `${tags}<div class="d-title">${esc(st.name)}</div><div class="d-sub">${esc(S.cfg.name)} · ${esc(id)}${st.raw && st.raw.StationAddress ? '<br>' + esc(st.raw.StationAddress) : ''}</div>
    <div class="d-section"><h3>${S.mode === 'platform' ? '月台與即將抵達' : S.mode === 'train' ? '接下來兩小時發車' : '下一班列車'}</h3>${rows.length ? `<ul class="stops">${rows.join('')}</ul>` : `<p class="empty">${S.mode === 'platform' ? '目前沒有列車在這一站的月台，也沒有推算中即將抵達的列車。' : '目前沒有這一站的班次資料。'}</p>`}</div>
    ${exitsHtml(exits)}
    <div class="d-section"><button type="button" class="linkish" id="btnCenter">在地圖上置中</button></div>`;
  openDetail('車站', body);
  drawExits(exits);
  $('btnCenter').onclick = () => map.flyTo(st.latlng, Math.max(map.getZoom(), 16), { duration: .6 });
}

/* ---------- 狀態列與更新循環 ---------- */
function setStatus() {
  const dot = $('liveDot'), el = $('statusText');
  const anyErr = Object.values(state.systems).some(S => S.status === 'ok' && S.live.feedErr);
  dot.classList.toggle('on', state.liveOk && !anyErr); dot.classList.toggle('err', !!anyErr);
  if (state.refreshing) { el.innerHTML = '更新中…'; return; }
  if (!state.lastLiveAt) { el.innerHTML = '載入路網資料…'; return; }
  const left = Math.max(0, Math.ceil((state.nextRefreshAt - Date.now()) / 1000));
  el.innerHTML = `${MOCK ? '<b>示範資料</b> · ' : ''}<b class="num">${state.trains.length}</b> 列 · 更新於 <span class="num">${fmtTime(state.lastLiveAt)}</span> · <span class="num">${left}</span> 秒後更新`;
}
setInterval(() => {
  setStatus();
  if (state.lastLiveAt && !document.hidden && Date.now() >= state.nextRefreshAt) refreshLive();
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.lastLiveAt && Date.now() >= state.nextRefreshAt) refreshLive(); });

$('btnRefresh').addEventListener('click', () => { if (state.lastLiveAt) refreshLive(); });
// 深色模式：預設跟系統，按鈕切換後記住
const darkMedia = window.matchMedia('(prefers-color-scheme: dark)');
const isDark = () => document.body.classList.contains('dark');
function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  $('btnTheme').textContent = dark ? '淺色' : '深色';
  const meta = $('metaTheme'); if (meta) meta.content = dark ? '#181d24' : '#ffffff';
  for (const S of Object.values(state.systems)) for (const st of S.stations.values()) if (st.marker && st.isX) st.marker.setStyle({ color: dark ? '#e6ebf1' : '#1c2430' });
  if (state.selected && state.selected.type === 'station') { const S = state.systems[state.selected.sys]; drawExits(S && S.exits ? (S.exits.get(state.selected.id) || []) : []); }
}
applyTheme(loadPref('theme') ? loadPref('theme') === 'dark' : darkMedia.matches);
darkMedia.addEventListener && darkMedia.addEventListener('change', e => { if (!loadPref('theme')) applyTheme(e.matches); });
$('btnTheme').addEventListener('click', () => { const d = !isDark(); applyTheme(d); savePref('theme', d ? 'dark' : 'light'); });
let meMarker = null;
$('btnLocate').addEventListener('click', () => {
  if (!navigator.geolocation) { toast('這個瀏覽器不支援定位'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    if (!meMarker) meMarker = L.circleMarker(ll, { radius: 7, color: '#fff', weight: 2, fillColor: '#1a73e8', fillOpacity: 1, pane: 'markerPane' }).bindTooltip('你的位置').addTo(map);
    else meMarker.setLatLng(ll);
    map.flyTo(ll, Math.max(map.getZoom(), 14), { duration: .8 });
  }, () => toast('取不到位置，請確認已允許瀏覽器使用定位'), { enableHighAccuracy: true, timeout: 8000 });
});
$('btnSystems').addEventListener('click', () => $('systemsPanel').classList.toggle('open'));
$('closeSystems').addEventListener('click', () => $('systemsPanel').classList.remove('open'));
$('closeDetail').addEventListener('click', closeDetail);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
map.on('click', () => { if (state.selected) closeDetail(); });

/* ---------- 啟動 ---------- */
(async function init() {
  await loadConfig();
  if (MOCK) { $('footNote').textContent = '目前為示範資料模式（?mock=1）：路網與列車皆為模擬，不代表真實營運。'; initBusSearch(); }
  else {
    fetch(`${DATA_BASE}/index.json`).then(r => r.ok ? r.json() : null).then(d => { if (d && d.generatedAt) { state.dataInfo = d; $('footNote').textContent += ` 路網資料產生於 ${new Date(d.generatedAt).toLocaleDateString('zh-TW')}。`; } initBusSearch(); }).catch(() => initBusSearch());
    await fetch(`${DATA_BASE}/holidays.json`).then(r => r.ok ? r.json() : null).then(cal => { if (cal && cal.holidays) setCalendar({ holidays: [...cal.holidays, ...CONFIG.holidays], workdays: cal.workdays || [] }); }).catch(() => {});
  }
  await Promise.all(ACTIVE_SYSTEMS.map(loadSystem));
  dedupeSharedLines();
  for (const S of Object.values(state.systems)) if (S.status === 'ok') drawSystem(S);
  const okCount = Object.values(state.systems).filter(S => S.status === 'ok').length;
  if (!okCount) { toast('還沒有路網資料：到 GitHub repo 的 Actions 頁籤，手動 Run workflow「更新資料並部署」一次，跑完會自動產生 data/ 並重新部署（步驟見 README）', 15000); $('statusText').textContent = '路網載入失敗（data/ 尚未產生）'; return; }
  for (const id of loadPref('bus') || []) if (state.bus.cities[id]) state.bus.on.add(id);
  for (const id of state.bus.on) toggleBusCity(id, true);
  const want = Q.get('sys'), saved = loadPref('view');
  for (const id of loadPref('hidden') || []) { const S = state.systems[id]; if (S && S.status === 'ok') { S.visible = false; for (const g of Object.values(S.layers)) map.removeLayer(g); } }
  if (want && state.systems[want] && state.systems[want].status === 'ok') zoomSystem(want);
  else if (saved && Number.isFinite(saved.lat) && Number.isFinite(saved.lng) && saved.z) map.setView([saved.lat, saved.lng], saved.z);
  else fitAll();
  renderSystems();
  map.on('moveend', () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => { const c = map.getCenter(); savePref('view', { lat: +c.lat.toFixed(5), lng: +c.lng.toFixed(5), z: map.getZoom() }); }, 500); });
  applyLabels();
  await refreshLive();
})();
</script>
